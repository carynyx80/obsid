<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Instrument+Serif:ital@1&family=Syne:wght@700&family=Martian+Mono:wght@400&display=block" rel="stylesheet">
<style>
html,body{margin:0}
.b{position:relative;width:1500px;height:500px;overflow:hidden;background:#fff;font-family:Syne}
.blob{position:absolute;right:-170px;top:-230px;width:900px;height:900px;border-radius:46% 54% 42% 58%/55% 45% 55% 45%;background:#D4FF3A}
.ring{position:absolute;right:120px;top:70px;width:360px;height:360px}
.chip{position:absolute;left:90px;top:62px;display:flex;gap:16px;align-items:center}
.pill{display:flex;align-items:center;gap:10px;border:2px solid rgba(11,15,5,.12);background:#fff;border-radius:999px;padding:9px 18px;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#0B0F05}
.dot{width:10px;height:10px;border-radius:50%;background:#2fbf71}
.k{font-weight:700;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:#7C8270}
h1{position:absolute;left:90px;top:120px;margin:0;font-family:Unbounded;font-weight:800;font-size:92px;line-height:.98;letter-spacing:-4px;color:#0B0F05}
.red{position:relative;display:inline-block}
.red::after{content:'';position:absolute;left:-6px;right:-6px;top:52%;height:46%;background:#0B0F05;border-radius:10px}
.it{font-family:'Instrument Serif';font-style:italic;font-weight:400;letter-spacing:-1px;font-size:104px}
.url{position:absolute;right:70px;bottom:44px;font-family:'Martian Mono';font-size:20px;color:#0B0F05;background:#fff;border-radius:999px;padding:12px 22px}
.tag{position:absolute;left:520px;bottom:52px;font-family:'Instrument Serif';font-style:italic;font-size:30px;color:#3A4030}
</style></head><body><div class="b">
<div class="blob"></div>
<svg class="ring" viewBox="0 0 400 400"><circle cx="200" cy="200" r="104" fill="none" stroke="#0B0F05" stroke-width="44"/><path d="M74 200 A126 126 0 0 0 326 200 Z" fill="#0B0F05"/></svg>
<div class="chip"><span class="pill"><span class="dot"></span>BNB Smart Chain</span><span class="k">Sealed bid launchpad</span></div>
<h1>Hosts in daylight.<br><span class="red">Buyers</span> <span class="it">in the dark.</span></h1>
<div class="tag">ICOs, IDOs and presales. One fair price.</div>
<div class="url">obsid.site</div>
</div></body></html>
